completion_models:
  indexing_model:
    model_provider: openai
    model: "${CF_INDEX_MODEL}"
    api_base: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
    api_key: ${CLOUDFLARE_API_TOKEN}
    auth_method: api_key
    call_args:
      temperature: 0.2
      max_tokens: 4096
    retry:
      type: exponential_backoff
      max_retries: 6
      base_delay: 5
      max_delay: 90
    rate_limit:
      type: sliding_window
      period_in_seconds: 60
      requests_per_period: 30

  query_model:
    model_provider: ollama
    model: "${OLLAMA_QUERY_MODEL}"
    api_base: "${OLLAMA_QUERY_URL}"
    api_key: ollama
    auth_method: api_key
    call_args:
      temperature: 0.3
      max_tokens: 1024
    retry:
      type: exponential_backoff
      max_retries: 4
      base_delay: 3
      max_delay: 30
    rate_limit:
      type: sliding_window
      period_in_seconds: 60
      requests_per_period: 20

embedding_models:
  default_embedding_model:
    model_provider: ollama
    model: "${OLLAMA_EMBEDDING_MODEL}"
    api_base: "${OLLAMA_EMBED_URL}"
    api_key: ollama
    auth_method: api_key
    retry:
      type: exponential_backoff
      max_retries: 5
      base_delay: 3
      max_delay: 60
    rate_limit:
      type: sliding_window
      period_in_seconds: 60
      requests_per_period: 60

input:
  type: json
  file_pattern: "documents\\.json"
  id_column: id
  title_column: title
  text_column: text

input_storage:
  type: file
  base_dir: input

output_storage:
  type: file
  base_dir: output

cache:
  type: json
  storage:
    type: file
    base_dir: cache

reporting:
  type: file
  base_dir: logs

vector_store:
  type: lancedb
  db_uri: output/lancedb
  vector_size: 1024

concurrent_requests: 1

chunking:
  type: tokens
  size: 800
  overlap: 100
  encoding_model: o200k_base

embed_text:
  embedding_model_id: default_embedding_model
  batch_size: 8

extract_graph:
  completion_model_id: indexing_model
  entity_types:
    - dịch vụ
    - danh mục
    - sự cố
    - thiết bị
    - chính sách
  max_gleanings: 0

summarize_descriptions:
  completion_model_id: indexing_model
  max_length: 400
  max_input_tokens: 4000

community_reports:
  completion_model_id: indexing_model
  max_length: 1200
  max_input_length: 6000

extract_claims:
  enabled: false

prune_graph:
  min_node_freq: 1
  min_edge_weight_pct: 0
  remove_ego_nodes: false
  lcc_only: false

local_search:
  completion_model_id: query_model
  embedding_model_id: default_embedding_model
  top_k_entities: 8
  top_k_relationships: 8
  max_context_tokens: 4096

global_search:
  completion_model_id: query_model
  dynamic_search_threshold: 2
  max_context_tokens: 8000
  data_max_tokens: 8000

snapshots:
  graphml: true
